const food=()=>{const M=G(dk()).meals||[],sm=k=>M.reduce((a,m)=>a+m[k],0),kc=sm('cal'),gl=S.goal,p=Math.min(kc/gl,1),C=389.6,r=gl-kc;
return`<div class="card c"><svg viewBox="0 0 150 150" width="150"><circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="75" cy="75" r="62" fill="none" stroke="${r<0?'#C47B6B':'#7C9885'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 75 75)" style="transition:stroke-dashoffset .7s"/><text x="75" y="72" text-anchor="middle" fill="currentColor" font-family="Cormorant Garamond" font-size="28" font-weight="700">${Math.round(kc)}</text><text x="75" y="92" text-anchor="middle" fill="#8A8078" font-size="11">${r<0?'+'+Math.abs(Math.round(r))+' peste':Math.round(r)+' rămase'}</text></svg><div class="st" style="border-color:var(--line)">${[['Proteine',sm('p')],['Carbo',sm('c')],['Grăsimi',sm('f')]].map(([n,v])=>`<div><b>${Math.round(v)}g</b><small>${n}</small></div>`).join('')}</div><div class="row"><span>Obiectiv zilnic (kcal)</span><input type="number" inputmode="numeric" data-i="goal" value="${gl}" style="width:100px;text-align:center"></div></div>
<div class="card"><h2>🍽️ Adaugă aliment</h2><input data-i="q" placeholder="Caută..." value="${esc(q)}"><div id="fl">${fl()}</div>${prem()?`<div class="row" style="background:none;padding:0"><input id="cn" placeholder="Aliment propriu"><input id="ck" type="number" inputmode="numeric" placeholder="kcal" style="width:90px"><button class="b sm" data-a="ac">+</button></div>`:`<div class="row lk" data-a="pay"><span>＋ Aliment propriu și încă 12 alimente 🔒</span></div>`}<small>Valorile sunt aproximative.</small></div>${M.length?`<div class="card"><h2>📋 Jurnal</h2>${M.map((m,i)=>`<div class="row"><span style="flex:1">${esc(m.name)}</span><span class="kc">${m.cal}</span><button data-a="df" data-v="${i}">×</button></div>`).join('')}</div>`:''}`};
const BT={idle:['Pregătit','4 · 7 · 8'],in:['Inspiră','4 secunde'],hold:['Ține','7 secunde'],out:['Expiră','8 secunde'],done:['✓ Gata','4 cicluri']};
const bUI=()=>{const e=$('#bc');if(!e)return;e.className='bc '+bp;$('#bx').textContent=BT[bp][0];$('#bs').textContent=BT[bp][1];$('#bb').textContent=bp==='idle'||bp==='done'?'Începe':'Oprește'};
const stopB=()=>{bt.forEach(clearTimeout);bt=[];bp='idle'};
const breath=()=>{stopB();let n=0;const cyc=()=>{bp='in';bUI();bt.push(setTimeout(()=>{bp='hold';bUI()},4e3),setTimeout(()=>{bp='out';bUI()},11e3),setTimeout(()=>{if(++n<4)cyc();else{bp='done';D().med=(D().med||0)+1;sv();bUI()}},19e3))};cyc()};
const runMed=()=>{clearInterval(iv);iv=setInterval(()=>{mT--;const e=$('#tm');if(e)e.textContent=fmt(mT);if(mT<=0){clearInterval(iv);mR=false;mT=0;D().med=(D().med||0)+1;sv();render()}},1e3)};
const med=()=>{const x=G(dk());
if(mc)return`<div class="card c"><button class="b o sm" data-a="mx">← Înapoi</button><div style="font-size:42px;margin-top:12px">${mc.i}</div><h2>${mc.t}</h2><small>${mc.d}</small><div class="big" id="tm" style="font-size:56px;color:${mc.c};margin:18px 0">${fmt(mT)}</div><button class="b" style="background:${mc.c}" data-a="mt">${mR?'⏸ Pauză':mT===0?'↻ Repetă':'▶ Start'}</button>${mT===0&&!mR?'<h2 style="margin-top:16px">🎉 Sesiune completată!</h2>':''}</div>`;
return`<div class="card c"><small>Sesiuni azi</small><div class="big" style="font-size:44px;color:var(--g)">${x.med||0}</div></div><div class="card"><h2>🌿 Meditații ghidate</h2>${MD.map((m,i)=>`<div class="row" data-a="ms" data-v="${i}" style="cursor:pointer"><span style="font-size:24px">${m.i}</span><div style="flex:1"><b>${m.t}</b><small>${m.d}</small></div><b style="color:${m.c}">${i>1&&!prem()?'🔒':m.min+' min'}</b></div>`).join('')}</div><div class="card c"><h2>🌬️ Respirație 4-7-8</h2><div class="bc" id="bc"><div><b id="bx"></b><small id="bs"></small></div></div><button class="b" id="bb" data-a="br"></button></div>`};
const mind=()=>{const x=G(dk()),g=x.gr||['','',''],L=last(7).map(a=>a[1].mood).filter(v=>v!=null),av=L.length?L.reduce((a,b)=>a+b)/L.length:null;
return`<div class="card"><h2>💚 Starea mea</h2><div class="mo">${E.map((e,i)=>`<div class="c"><button class="${x.mood===i?'on':''}" data-a="mood" data-v="${i}">${e}</button><small>${EL[i]}</small></div>`).join('')}</div>${av!==null?`<div class="row"><span>Media pe 7 zile</span><span class="kc">${E[Math.round(av)]} ${av.toFixed(1)}/4</span></div>`:''}</div>
<div class="card"><h2>🙏 Recunoștință</h2><small style="margin-bottom:8px">3 lucruri pentru care ești recunoscător azi</small>${[0,1,2].map(i=>`<div class="row" style="background:none;padding:0"><span>${'🌱🌿🌳'.slice(i*2,i*2+2)}</span><input data-i="g" data-v="${i}" value="${esc(g[i]||'')}" placeholder="Lucrul ${i+1}..."></div>`).join('')}</div>
<div class="card"><h2>✍️ Jurnal</h2><textarea data-i="j" rows="5" placeholder="Scrie liber, fără judecată...">${esc(x.j||'')}</textarea><small style="text-align:right" id="jc">${(x.j||'').length} caractere</small></div>
<div class="card"><h2>💡 Sfaturi</h2>${TP.map((t,i)=>`<div class="row" data-a="tip" data-v="${i}" style="cursor:pointer"><span style="font-size:22px">${t[0]}</span><b style="flex:1">${t[1]}</b><span>${tp===i?'⌄':'›'}</span></div>${tp===i?`<small style="padding:8px 12px;font-size:13px">${t[2]}</small>`:''}`).join('')}</div>
<div class="card" style="border:1.5px solid #E8C9A0"><h2>📞 Dacă ai nevoie de ajutor</h2><div style="line-height:1.9;font-size:14px">🚨 Urgențe: <b>112</b><br>💙 Antisuicid România: <b>0800 801 200</b><br>🧒 Telefonul Copilului: <b>116 111</b></div><small>Aplicația nu înlocuiește sprijinul unui specialist.</small></div>`};
const hdr=()=>{const h=new Date().getHours();return`<div style="display:flex;align-items:center;gap:10px;min-width:0"><img src="icon.svg" width="40" height="40" alt="VitaSphere" style="border-radius:11px;flex:none"><div><h1>${h<12?'Bună dimineața':h<18?'Bună ziua':'Bună seara'}</h1><small>VitaSphere · ${new Date().toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'})}</small></div></div><div class="hb"><button class="pill${prem()?' gold':''}" data-a="pay">${prem()?(S.paid?plan().toUpperCase():'Trial · '+tl()+'z'):'✨ Premium'}</button><button class="ic" data-a="set">⚙️</button></div>`};
const pc=p=>{const cur=plan()===p.id,y=bill==='y';return`<div class="pl${p.id==='plus'?' hot':''}">${p.id==='plus'?'<em>Cel mai ales</em>':''}<div class="row" style="background:none;padding:0;margin:0"><h2 style="margin:0">${p.n}</h2><div style="text-align:right"><b>${p.m?fm(y?p.y/12:p.m)+' lei/lună':'0 lei'}</b>${p.m&&y?`<small>${p.y} lei facturat anual</small>`:''}</div></div><ul>${p.f.map(f=>`<li>${f}</li>`).join('')}</ul><button class="b${p.id==='plus'?'':' o'}" style="width:100%" data-a="pk" data-v="${p.id}">${cur?'Planul tău':p.m?(S.trialUsed?'Alege '+p.n:'Încearcă 7 zile gratuit'):'Rămâi pe Free'}</button></div>`};
const sheet=()=>modal==='set'?`<div class="ov" data-a="close"><div class="sh"><h2>Setări</h2><div class="row"><b>Temă întunecată ${prem()?'':'🔒'}</b><button class="b sm" data-a="th">${S.dark&&prem()?'Oprește':'Pornește'}</button></div><div class="row"><b>Exportă datele</b><button class="b sm" data-a="ex">JSON</button></div><div class="row"><b>Importă date</b><input type="file" accept=".json" data-i="imp" style="width:150px;font-size:12px"></div><small>Datele rămân doar pe acest dispozitiv. Fă export din când în când.</small></div></div>`:
`<div class="ov" data-a="close"><div class="sh"><img src="icon.svg" width="46" height="46" alt="" style="border-radius:13px;margin-bottom:8px"><h2>VitaSphere Premium</h2><small>${S.trialUsed?'Alege planul potrivit.':'7 zile gratuit. Te anunțăm cu 2 zile înainte să se termine.'}</small><div class="seg"><button class="${bill==='m'?'on':''}" data-a="bl" data-v="m">Lunar</button><button class="${bill==='y'?'on':''}" data-a="bl" data-v="y">Anual · −38%</button></div>${PL.map(pc).join('')}<small class="c">Mod demo: plata nu e conectată încă.</small></div></div>`;
const V={home,cal,food,med,mind};
function render(){document.documentElement.dataset.t=S.dark&&prem()?'dark':'';$('#hd').innerHTML=hdr();$('#v').innerHTML=V[tab]();document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));$('#m').innerHTML=modal?sheet():'';if(tab==='med')bUI()}
const enter=()=>{const v=$('#v');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');setTimeout(()=>v.classList.remove('enter'),900)};
const A={tab:v=>{tab=v;modal=null;render();$('#v').scrollTop=0;enter()},mood:v=>{D().mood=+v;sv();render()},water:v=>{const x=D();x.water=(x.water||0)===+v?+v-1:+v;sv();render()},aff:()=>{ai=(ai+1)%AF.length;render()},day:v=>{cd=new Date(cd.getFullYear(),cd.getMonth(),+v);render()},pm:v=>{cd=new Date(cd.getFullYear(),cd.getMonth()+(+v),1);render()},
ae:()=>{const t=evt.trim();if(!t)return;const k=dk(cd),x=S.d[k]||(S.d[k]={});x.ev=[...(x.ev||[]),t];evt='';sv();render()},de:v=>{G(dk(cd)).ev.splice(+v,1);sv();render()},
af:v=>{const f=FD[+v];D().meals=[...(D().meals||[]),{name:f[0],cal:f[1],p:f[2],c:f[3],f:f[4]}];q='';sv();render()},df:v=>{D().meals.splice(+v,1);sv();render()},ac:()=>{const n=$('#cn').value.trim(),k=parseFloat($('#ck').value);if(!n||!(k>=0))return;D().meals=[...(D().meals||[]),{name:n,cal:k,p:0,c:0,f:0}];sv();render()},
ms:v=>{if(+v>1&&!prem())return A.pay();mc=MD[+v];mT=mc.min*60;mR=false;render()},mt:()=>{mR=!mR;if(mR){if(mT<=0)mT=mc.min*60;runMed()}else clearInterval(iv);render()},mx:()=>{clearInterval(iv);mc=null;mR=false;render()},
br:()=>{if(bp==='idle'||bp==='done')breath();else{stopB();bUI()}},tip:v=>{tp=tp===+v?-1:+v;render()},
pay:()=>{modal='pay';render()},set:()=>{modal='set';render()},close:()=>{modal=null;render()},bl:v=>{bill=v;render()},
pk:id=>{S.plan=id;if(id!=='free'){if(!S.trialUsed){S.trialUsed=1;S.trial=Date.now()+7*864e5}else S.paid=1}sv();modal=null;render()},
th:()=>{if(!prem())return A.pay();S.dark=!S.dark;sv();render()},ex:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='vitasphere-'+dk()+'.json';a.click()}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||(a.dataset.a==='close'&&e.target!==a))return;const f=A[a.dataset.a];f&&f(a.dataset.v)});
document.addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(!i)return;
if(i==='imp'){const f=t.files[0];if(f)f.text().then(s=>{try{const o=JSON.parse(s);if(o&&o.d){S.d={...S.d,...o.d};sv();modal=null;render()}}catch{}});return}
if(i==='steps')D().steps=Math.max(0,parseInt(t.value)||0);else if(i==='sleep')D().sleep=Math.max(0,Math.min(24,parseFloat(t.value)||0));else if(i==='goal')S.goal=Math.max(500,parseInt(t.value)||2000);else return;sv();render()});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;
if(i==='j'){D().j=t.value;$('#jc').textContent=t.value.length+' caractere'}else if(i==='g'){const x=D();(x.gr=x.gr||['','',''])[+t.dataset.v]=t.value}else if(i==='q'){q=t.value;$('#fl').innerHTML=fl();return}else if(i==='ev'){evt=t.value;return}else return;sv()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.i==='ev')A.ae()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!mR&&bp==='idle')render()});
render();enter();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
